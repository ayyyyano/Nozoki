name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README_EN.md'
      - 'AGENTS.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
    inputs:
      bootstrap_database:
        description: 'Create the D1 database when it is missing and use its ID for this run'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Cloudflare account
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN under Settings → Environments → production. Grant account-level Workers Scripts Edit and D1 Edit permissions.'
            exit 1
          fi
          if [[ -n "$ACCOUNT_ID" ]]; then
            echo 'Using repository variable'
          else
            accounts=()
            page=1
            while :; do
              if ! response=$(curl --silent --show-error --fail --get \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --data-urlencode 'per_page=50' --data-urlencode "page=$page" \
                'https://api.cloudflare.com/client/v4/accounts'); then
                echo '::error::Unable to list Cloudflare accounts. Check the token and account access.'
                exit 1
              fi
              if ! jq -e '.success == true and (.result | type == "array" and all(.[]; .id | type == "string" and test("^[a-fA-F0-9]{32}$"))) and (.result_info.total_pages | type == "number" and . >= 0 and floor == .)' >/dev/null <<< "$response"; then
                echo '::error::Cloudflare returned an invalid account list. Check the token and account access.'
                exit 1
              fi
              while IFS= read -r id; do
                [[ -n "$id" ]] && accounts+=("$id")
              done < <(jq -r '.result[].id // ""' <<< "$response")
              total_pages=$(jq -r '.result_info.total_pages' <<< "$response")
              (( page >= total_pages )) && break
              (( page += 1 ))
            done
            if (( ${#accounts[@]} == 0 )); then
              echo '::error::No Cloudflare accounts found. Check the token account access permissions.'
              exit 1
            elif (( ${#accounts[@]} > 1 )); then
              echo '::error::Multiple accounts found. Set repository variable CLOUDFLARE_ACCOUNT_ID to one of these account IDs:'
              printf '%s\n' "${accounts[@]}"
              exit 1
            fi
            ACCOUNT_ID="${accounts[0]}"
            echo "Resolved Cloudflare account ID: $ACCOUNT_ID"
          fi
          if [[ ! "$ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo '::error::Invalid Cloudflare account ID. Check CLOUDFLARE_ACCOUNT_ID or account access.'
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Worker
        run: pnpm build
      - name: Ensure D1 database
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.bootstrap_database == true) || vars.CLOUDFLARE_BOOTSTRAP_D1 == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN in the production environment secrets.'
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo '::error::Invalid CLOUDFLARE_ACCOUNT_ID. Resolve the account before bootstrapping D1.'
            exit 1
          fi
          DB_NAME=$(node scripts/prepare-cloudflare-config.mjs name wrangler.jsonc)
          if [[ ! "$DB_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo '::error::Invalid database_name for the DB binding in wrangler.jsonc.'
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          list=$(curl --silent --show-error --fail --get \
            --header "$header" --data-urlencode 'per_page=1000' "$api")
          if ! jq -e '.success == true and (.result | type == "array")' >/dev/null <<< "$list"; then
            echo '::error::Unable to list D1 databases. Check that the token can read D1 databases.'
            exit 1
          fi
          DB_ID=$(jq -r --arg name "$DB_NAME" 'first(.result[] | select(.name == $name) | .uuid) // empty' <<< "$list")
          if [[ -z "$DB_ID" ]]; then
            created=$(curl --silent --show-error --fail --request POST \
              --header "$header" --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$DB_NAME" '{ name: $name }')" "$api")
            if ! jq -e '.success == true and (.result.uuid | type == "string")' >/dev/null <<< "$created"; then
              echo '::error::Unable to create the D1 database. Check that the token can create D1 databases.'
              exit 1
            fi
            DB_ID=$(jq -r '.result.uuid' <<< "$created")
            echo "Created D1 database $DB_NAME"
          else
            echo "Using existing D1 database $DB_NAME"
          fi
          echo "D1 database ID: $DB_ID"
          node scripts/prepare-cloudflare-config.mjs config "$DB_ID" wrangler.jsonc wrangler.bootstrap.jsonc
          echo "CLOUDFLARE_DEPLOY_CONFIG=wrangler.bootstrap.jsonc" >> "$GITHUB_ENV"
      - name: Apply D1 migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN in the production environment secrets.'
            exit 1
          fi
          pnpm deploy:cloudflare
