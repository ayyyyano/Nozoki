name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build documentation
        run: pnpm --filter nozoki-docs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/.vitepress/dist
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Artifact $ARTIFACT_NAME is visible"
              exit 0
            fi
            echo "Waiting for artifact $ARTIFACT_NAME ($attempt/12)"
            sleep 5
          done
          echo "Artifact $ARTIFACT_NAME did not become visible" >&2
          exit 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
